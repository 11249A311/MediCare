{% extends "base.html" %}
{% block content %}
<section class="auth-card">
  <div class="symbol">✚</div><h1>Welcome back</h1>
  <p class="muted">Login to search the medicine catalogue.</p>
  <form method="POST">
    <label>Email address</label><input type="email" name="email" required placeholder="Enter your email">
    <label>Password</label><input type="password" name="password" required placeholder="Enter your password">
    <button type="submit">Login</button>
  </form>
  <p class="switch">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
