{% extends "base.html" %}
{% block content %}
<section class="auth-card">
  <div class="symbol">✚</div><h1>Create your account</h1>
  <p class="muted">Register to search medicine information.</p>
  <form method="POST">
    <label>Full name</label><input name="name" required placeholder="Enter your name">
    <label>Email address</label><input type="email" name="email" required placeholder="name@example.com">
    <label>Password</label><input type="password" name="password" minlength="6" required placeholder="At least 6 characters">
    <label>Age</label><input type="number" name="age" min="1" max="120" required placeholder="Enter your age">
    <button type="submit">Register</button>
  </form>
  <p class="switch">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</section>
{% endblock %}
